<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천 아이템 모음</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #181a1f;
      --muted: #6b7280;
      --accent: #111827;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .header {
      text-align: center;
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }
    .disclosure {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #3730a3;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: center;
    }
    .search {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      background: var(--card);
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.1s ease;
    }
    .item:active { transform: scale(0.99); }
    .thumb {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #f3f4f6;
      flex-shrink: 0;
    }
    .info { flex: 1; min-width: 0; }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #4b5563;
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 4px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .desc {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>추천 아이템 모음</h1>
    </div>
    <div class="disclosure">
      이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
    </div>
    <input id="search" class="search" type="search" placeholder="찾으시는 상품명이나 번호를 입력하세요" />
    <div id="list" class="list"></div>
  </div>
  <script>
    let items = [];
    async function load() {
      const res = await fetch('./items.json?_=' + Date.now());
      items = await res.json();
      render('');
    }
    function render(q) {
      const box = document.getElementById('list');
      const kw = q.trim().toLowerCase();
      const filtered = items.filter(it =>
        !kw ||
        (it.title || '').toLowerCase().includes(kw) ||
        (it.tag || '').toLowerCase().includes(kw) ||
        (it.desc || '').toLowerCase().includes(kw)
      );
      if (!filtered.length) {
        box.innerHTML = '<div class="empty">아직 등록된 상품이 없거나 검색 결과가 없습니다.</div>';
        return;
      }
      box.innerHTML = filtered.map(it => `
        <a class="item" href="${it.url}" target="_blank" rel="noopener noreferrer">
          ${it.image ? `<img class="thumb" src="${it.image}" alt="" />` : ''}
          <div class="info">
            ${it.tag ? `<span class="tag">${it.tag}</span>` : ''}
            <p class="title">${it.title}</p>
            <p class="desc">${it.desc || '쿠팡에서 바로 확인하기'}</p>
          </div>
        </a>
      `).join('');
    }
    document.getElementById('search').addEventListener('input', e => render(e.target.value));
    load();
  </script>
</body>
</html>
